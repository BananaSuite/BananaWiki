# Monthly outbound traffic limit in gibibytes (GiB, 1024^3 bytes).
# 12 GiB leaves margin under Azure's explicit 15 GB/month free-account
# bandwidth allowance.
LIMIT_GIB=12

# Wait this long after boot before checking usage. This gives an operator time
# to SSH in and disable the fuse after manually starting a VM that already
# exceeded the monthly limit.
GRACE_MINUTES_AFTER_BOOT=10

# Set to 1 to log what would happen without powering off the host.
DRY_RUN=0

# Services to stop before powering off. Missing services are ignored.
STOP_SERVICES="nginx bananawiki"
