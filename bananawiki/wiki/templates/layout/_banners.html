{% if impersonating %}
<div class="banner banner--warning" role="status">
  {{ t('banner.impersonating', user=current_user.username) }}
  <form class="inline" method="post" action="{{ url_for('auth.stop_impersonation') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button class="btn btn--small" type="submit">{{ t('banner.stop_impersonating') }}</button>
  </form>
</div>
{% endif %}
{% if site().maintenance_mode and is_admin %}
<div class="banner banner--danger" role="status">{{ t('banner.maintenance_admin') }}</div>
{% endif %}
{{ slot('page.banners') }}
