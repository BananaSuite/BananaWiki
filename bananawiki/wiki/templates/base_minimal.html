{#- Layout for sign-in, setup and other pages shown outside the wiki shell. -#}
{% extends "base.html" %}
{% block shell %}
<div class="shell shell--bare">
  <main id="main" class="main" tabindex="-1">
    <div class="content-column">
      <p class="bare-brand"><a class="topbar__brand" href="/"><img src="{{ url_for('static', filename='favicons/banana_yellow.png') }}" alt="" width="28" height="28"><span>{{ site_name() }}</span></a></p>
      {% block content %}{% endblock %}
      {% include "layout/_footer.html" %}
    </div>
  </main>
</div>
{% endblock %}
