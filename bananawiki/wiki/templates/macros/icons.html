{# Decorative navigation icons; names select only these fixed SVG paths. #}
{% macro icon(name, size=18) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if name == 'search' %}<circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/>
{% elif name == 'sliders' %}<path d="M3 5h3m4 0h7M3 10h7m4 0h3M3 15h1m4 0h9"/><circle cx="8" cy="5" r="2"/><circle cx="12" cy="10" r="2"/><circle cx="6" cy="15" r="2"/>
{% elif name == 'columns' %}<rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M7.5 3.5v13m5-13v13"/>
{% elif name == 'shapes' %}<rect x="2.5" y="2.5" width="6" height="6" rx="1"/><circle cx="14" cy="6" r="3.5"/><path d="m10 11 4 6H6Z"/>
{% elif name == 'message' %}<path d="M5 3h10a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H8l-5 3V5a2 2 0 0 1 2-2Z"/><path d="M6.5 7h7m-7 3h4"/>
{% elif name == 'users' %}<circle cx="7" cy="6" r="3"/><path d="M2 17v-2a5 5 0 0 1 10 0v2m1-14a3 3 0 0 1 0 6m2 3a4 4 0 0 1 3 4v1"/>
{% elif name == 'trophy' %}<path d="M6 3h8v5a4 4 0 0 1-8 0Zm0 2H3v2a3 3 0 0 0 3 3m8-5h3v2a3 3 0 0 1-3 3m-4 2v5m-4 0h8"/>
{% elif name == 'globe' %}<circle cx="10" cy="10" r="7.5"/><ellipse cx="10" cy="10" rx="3.5" ry="7.5"/><path d="M3 7h14M3 13h14"/>
{% elif name == 'lock' %}<rect x="4" y="8" width="12" height="9" rx="2"/><path d="M6.5 8V6a3.5 3.5 0 0 1 7 0v2m-3.5 4v2"/>
{% else %}<rect x="3" y="3" width="5" height="5" rx="1"/><rect x="12" y="3" width="5" height="5" rx="1"/><rect x="3" y="12" width="5" height="5" rx="1"/><rect x="12" y="12" width="5" height="5" rx="1"/>
{% endif %}
</svg>
{%- endmacro %}
