{# Canvas controls share one quiet line style across platforms and themes. #}
{% macro icon(name) -%}
<svg class="canvas-tool__icon" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
<g transform="scale(.833333)">
{% if name == 'add-text' %}<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
{% elif name == 'add-shape' %}<path d="m12 3 9 9-9 9-9-9Z"/>
{% elif name == 'add-code' %}<path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-14-2 18"/>
{% elif name == 'add-image' %}<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m21 15-5-5-8 11"/>
{% elif name == 'add-video' %}<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m10 8 6 4-6 4Z"/>
{% elif name == 'add-wiki_page' %}<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Zm0 0v6h6M8 13h8M8 17h5"/>
{% elif name == 'add-external_link' %}<path d="M14 3h7v7m0-7L10 14M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/>
{% elif name == 'edit' %}<path d="m16 3 5 5-12 12-6 1 1-6Zm-2 2 5 5"/>
{% elif name == 'connect' %}<circle cx="4" cy="12" r="2"/><path d="M6 12h14m-5-5 5 5-5 5"/>
{% elif name == 'duplicate' %}<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>
{% elif name == 'front' %}<rect x="3" y="11" width="10" height="10" rx="1.5"/><path d="M13 16h6a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-6a2 2 0 0 0-2 2v6M6 7l3-3 3 3M9 4v6"/>
{% elif name == 'back' %}<rect x="11" y="3" width="10" height="10" rx="1.5"/><path d="M11 8H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-6m-1 4 3 3 3-3m-3 3v-6"/>
{% elif name == 'delete' %}<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/>
{% elif name == 'undo' %}<path d="m8 4-5 5 5 5M3 9h10a7 7 0 0 1 0 14"/>
{% elif name == 'redo' %}<path d="m16 4 5 5-5 5m5-5H11a7 7 0 0 0 0 14"/>
{% elif name == 'snap' %}<path d="M8 3v18M16 3v18M3 8h18M3 16h18"/>
{% elif name == 'zoom-out' %}<path d="M5 12h14"/>
{% elif name == 'zoom-in' %}<path d="M5 12h14M12 5v14"/>
{% elif name == 'fit' %}<path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/>
{% elif name == 'minimap' %}<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h4v4H7Zm7 4h3v4h-3ZM7 15h4"/>
{% endif %}
</g>
</svg>
{%- endmacro %}
