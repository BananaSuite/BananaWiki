{% extends "custom_pages/_page.html" %}
{% block page_body %}
{% if embed_url %}
<div class="cp-youtube">
  <iframe src="{{ embed_url }}" title="{{ page.title or t('custom_pages.type.youtube_video') }}" loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>
<p class="small"><a href="https://www.youtube.com/watch?v={{ video_id }}" target="_blank" rel="noopener noreferrer">{{ t('custom_pages.view.watch_on_youtube') }}</a></p>
{% else %}
<p class="empty-state">{{ t('custom_pages.view.no_video') }}</p>
{% endif %}
{% endblock %}
