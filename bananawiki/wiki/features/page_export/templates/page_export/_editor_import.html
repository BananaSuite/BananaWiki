{#- Load a Markdown file into the editor (script only; the editor form is not multipart). -#}
<div class="md-import" data-md-import data-url="{{ url_for('page_export.import_markdown', slug=page.slug) }}" hidden>
  <div class="cluster cluster--baseline">
    {#- Inside its label, like the attachments' "Add files" (attachments/_editor_panel.html). -#}
    <label class="btn btn--small">
      <span>{{ t('page_export.import_file') }}</span>
      <input id="md-import-input" class="visually-hidden" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" data-md-import-input>
    </label>
    <span class="small muted cluster__text">{{ t('page_export.import_file_hint') }}</span>
  </div>
</div>
<script src="{{ asset_url('import.js', blueprint='page_export') }}" defer></script>
