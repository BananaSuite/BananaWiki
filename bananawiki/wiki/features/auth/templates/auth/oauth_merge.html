{% extends "base_minimal.html" %}
{% block title %}{{ t('auth.oauth.merge_title') }}{% endblock %}
{% block content %}
<div class="card card--narrow">
  <h1>{{ t('auth.oauth.merge_title') }}</h1>
  <p id="code-hint">{{ t('auth.oauth.merge_code_body', name=local.username) }}</p>
  <form method="post" action="{{ url_for('auth.platform_oauth_merge') }}" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="code">{{ t('auth.two_step.code') }}</label>
      <input id="code" name="code" required maxlength="32" autocomplete="one-time-code" autocapitalize="characters"
        spellcheck="false" autofocus aria-describedby="code-hint">
    </div>
    <button class="btn btn--primary" type="submit">{{ t('auth.oauth.merge_submit') }}</button>
  </form>
  <p class="small"><a href="{{ url_for('auth.platform_oauth_connect') }}">{{ t('auth.oauth.connect.other_choice') }}</a></p>
</div>
{% endblock %}
