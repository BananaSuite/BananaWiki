{% extends "base_minimal.html" %}
{% block title %}{{ t('auth.setup.title') }}{% endblock %}
{% block content %}
<div class="card card--narrow">
  <h1>{{ t('auth.setup.title') }}</h1>
  <p>{{ t('auth.setup.token_intro') }}</p>
  <pre class="small">bananawiki setup-token</pre>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="setup_token">{{ t('auth.setup.token_label') }}</label>
      <input id="setup_token" name="setup_token" type="password" autocomplete="off" required autofocus>
    </div>
    <button class="btn btn--primary" type="submit">{{ t('common.continue') }}</button>
  </form>
</div>
{% endblock %}
