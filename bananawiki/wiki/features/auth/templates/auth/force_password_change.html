{% extends "base_minimal.html" %}
{% block title %}{{ t('auth.force_change.title') }}{% endblock %}
{% block content %}
<div class="card card--narrow">
  <h1>{{ t('auth.force_change.title') }}</h1>
  <p>{{ t('auth.force_change.body') }}</p>
  {% if error %}<div class="alert alert--error" role="alert"><div class="alert__body">{{ error }}</div></div>{% endif %}
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="username">{{ t('auth.field.username') }}</label>
      <input id="username" name="username" value="{{ user.username }}" autocomplete="username" minlength="3" maxlength="50">
      <p class="hint">{{ t('auth.force_change.username_hint') }}</p>
    </div>
    <div class="field">
      <label for="current_password">{{ t('auth.field.current_password') }}</label>
      <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
    </div>
    <div class="field">
      <label for="new_password">{{ t('auth.field.new_password') }}</label>
      <input id="new_password" name="new_password" type="password" autocomplete="new-password" required minlength="8" maxlength="1024">
    </div>
    <div class="field">
      <label for="confirm_password">{{ t('auth.field.confirm_password') }}</label>
      <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
    </div>
    <button class="btn btn--primary" type="submit">{{ t('auth.force_change.submit') }}</button>
  </form>
</div>
{% endblock %}
