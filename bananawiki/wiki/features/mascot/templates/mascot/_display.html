{% import "macros/forms.html" as forms with context %}
{#- Rendered only while the sunglasses are on: the mascot itself cannot be hidden (mascot/__init__.py). -#}
<link rel="stylesheet" href="{{ asset_url('mascot/mascot.css') }}">
<section class="form-section mascot-settings" aria-labelledby="mascot-heading">
  <h2 id="mascot-heading">{{ t('mascot.settings.title') }}</h2>
  <p class="hint">{{ t('mascot.settings.hint') }}</p>
  <div class="cluster">
    <form class="inline" method="post" action="{{ url_for('mascot.own_choice') }}">
      {{ forms.csrf() }}
      <input type="hidden" name="action" value="shades_off">
      <button type="submit" class="btn mascot-button">
        {{ sprite('normal', 'mascot-button__sprite') }}
        <span>{{ t('mascot.settings.shades_off') }}</span>
      </button>
    </form>
  </div>
</section>
