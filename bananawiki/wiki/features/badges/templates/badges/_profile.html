<section class="card" aria-labelledby="badges-heading">
  <h2 id="badges-heading">{{ t('badges.profile.title') }}</h2>
  <ul class="cluster" style="list-style:none;padding:0;margin:0">
    {% for badge in badges %}
    <li class="badge" style="border:1px solid {{ badge.color }}" title="{{ badge.description }}">
      <span aria-hidden="true">{{ badge.icon }}</span> {{ badge.name }}{% if badge.times > 1 %} ×{{ badge.times }}{% endif %}
      <span class="visually-hidden">{{ badge.description }}</span>
    </li>
    {% endfor %}
  </ul>
</section>
