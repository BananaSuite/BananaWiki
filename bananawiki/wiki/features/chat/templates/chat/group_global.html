{% extends "base.html" %}
{% block title %}{{ t('chat.groups.global_name') }}{% endblock %}
{% block content %}
<header class="page-header"><h1>{{ t('chat.groups.global_name') }}</h1></header>
<div class="card">
  <p>{{ t('chat.groups.global_intro') }}</p>
  <form method="post" class="form" action="{{ url_for('chat.group_global') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="btn-row">
      <button class="btn btn--primary" type="submit">{{ t('chat.groups.join_button') }}</button>
      <a class="btn" href="{{ url_for('chat.group_list') }}">{{ t('common.cancel') }}</a>
    </div>
  </form>
</div>
{% endblock %}
