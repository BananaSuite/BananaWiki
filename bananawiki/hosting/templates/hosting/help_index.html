{% extends "hosting/base.html" %}
{% block title %}{{ t('hosting.help.title') }}{% endblock %}
{% block content %}
<h1>{{ t('hosting.help.title') }}</h1>
<ul class="link-list">
{% for article in articles %}
  <li><a href="{{ url_for('public.help_article', slug=article.slug, lang=help_language) }}"><strong>{{ article.title }}</strong><span>{{ article.description }}</span></a></li>
{% endfor %}
</ul>
{% endblock %}
