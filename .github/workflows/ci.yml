name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.9
      - name: Ruff (pyproject.toml rules)
        run: python -m ruff check bananawiki tests banana wsgi.py gunicorn.conf.py scripts/tts_worker.py scripts/lock_requirements.py
      - name: ShellCheck
        run: |
          files=$(git ls-files '*.sh')
          if [ -n "$files" ]; then shellcheck --severity=warning $files; else echo "No shell scripts."; fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Tools used by lifecycle and backup tests
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y age openssh-client nftables
      - name: Install (hash-pinned wheels only, as on a managed server)
        run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes --upgrade -r requirements-build.lock
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock
          python -m pip install --only-binary=:all: pytest pytest-xdist
      - name: Tests
        run: python -m pytest tests -q -n 2 -p no:cacheprovider -o addopts=""
      - name: Root filesystem boundary tests
        run: sudo "$(command -v python)" -m pytest tests/ops/test_ops_tenant_files.py tests/ops/test_ops_firewall.py -q -p no:cacheprovider -o addopts=""
      - name: Build and exercise the installed distribution
        if: matrix.python == '3.12'
        run: |
          python -m pip install --only-binary=:all: build
          python -m build --outdir "$RUNNER_TEMP/wiki-dist"
          package_probe="$RUNNER_TEMP/wiki-package-probe"
          mkdir -p "$package_probe"
          python -m pip install --no-deps --target "$package_probe/installed" "$RUNNER_TEMP"/wiki-dist/*.whl
          cp -a tests "$package_probe/tests"
          cd "$package_probe"
          export PYTHONPATH="$package_probe/installed"
          python -c 'from pathlib import Path; import bananawiki; assert Path(bananawiki.__file__).resolve().is_relative_to(Path("installed").resolve())'
          python -m pytest tests/test_core_assets.py tests/test_core_json_requests.py \
            tests/features/test_api_protocol.py \
            tests/features/test_auth_onboarding.py \
            tests/ops/test_ops_agent.py tests/hosting/test_runtime_agent_ops.py \
            tests/hosting/test_runtime_agent.py::test_start_replaces_outdated_sandbox_even_when_image_and_policy_match \
            tests/features/test_plugins_external.py::test_plugin_kit_download \
            'tests/features/test_tts_gpu.py::test_piper_privacy_default_precedes_import_and_preserves_operator_setting[local-None]' \
            'tests/features/test_tts_gpu.py::test_piper_privacy_default_precedes_import_and_preserves_operator_setting[local-0]' \
            tests/ops/test_ops_components.py::test_release_refreshes_inherited_build_tools_before_installing_dependencies \
            -q -p no:cacheprovider -o addopts=""

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        install: [requirements, package]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - name: Install runtime environment (wheels only)
        env:
          INSTALL_METHOD: ${{ matrix.install }}
        run: |
          python -m venv "$RUNNER_TEMP/runtime-audit"
          runtime_python="$RUNNER_TEMP/runtime-audit/bin/python"
          "$runtime_python" -m pip install --only-binary=:all: --no-deps --require-hashes --upgrade -r requirements-build.lock
          if [ "$INSTALL_METHOD" = requirements ]; then
            "$runtime_python" -m pip install --only-binary=:all: --require-hashes -r requirements.lock
          else
            "$runtime_python" -m pip install --only-binary=:all: '.[hosting,tts]'
          fi
          "$runtime_python" -m pip check
          # The checkout is reviewed by lint/tests; audit its resolved third-party
          # dependencies without requiring the unreleased project on PyPI.
          if [ "$INSTALL_METHOD" = package ]; then
            "$runtime_python" -m pip uninstall -y bananawiki
          fi
      - name: Known vulnerabilities in runtime dependencies
        run: python -m pip_audit --path "$RUNNER_TEMP/runtime-audit/lib/python3.12/site-packages" --strict --progress-spinner off

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [Dockerfile, Dockerfile.tenant]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -f ${{ matrix.dockerfile }} -t bananawiki-ci:${{ strategy.job-index }} .
      - name: Check image for high and critical vulnerabilities with available fixes
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz \
            --output "$RUNNER_TEMP/trivy.tar.gz"
          printf '%s  %s\n' 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a "$RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/trivy.tar.gz" --directory "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 --timeout 5m bananawiki-ci:${{ strategy.job-index }}
      - name: Start read-only, unprivileged, as an arbitrary UID, and wait for /health
        run: |
          mkdir -p "$RUNNER_TEMP/data" && sudo chown 4242:4242 "$RUNNER_TEMP/data"
          docker run -d --name probe --read-only --user 4242:4242 --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --tmpfs /run:rw,nosuid,size=16m --mount "type=bind,src=$RUNNER_TEMP/data,dst=/data" \
            -e BW_MANAGED_HOSTING=1 -p 127.0.0.1:5001:5001 bananawiki-ci:${{ strategy.job-index }}
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5001/health; then exit 0; fi
            sleep 3
          done
          docker logs probe
          exit 1
      # The runtime agent's own command lines (seccomp profile, IPv6 sysctls, bwt… bridges, the mount gate and its
      # release, the mount comparison, one-shot task containers) against a real Docker, as root like the agent.
      - name: Start wikis through the runtime agent, run tasks, stop them
        if: matrix.dockerfile == 'Dockerfile.tenant'
        env:
          IMAGE: bananawiki-ci:${{ strategy.job-index }}
        run: |
          AGENT="$RUNNER_TEMP/agent"
          sudo install -d -m 0755 "$AGENT" "$AGENT/instances"
          sudo install -d -m 0700 "$AGENT/private"
          sudo install -d -m 0700 -o 4242 -g 4242 "$AGENT/instances/published" "$AGENT/instances/isolated"
          sudo env REPO="$GITHUB_WORKSPACE" AGENT="$AGENT" IMAGE="$IMAGE" python3 -I - <<'EOF'
          import json, os, subprocess, sys, time, urllib.request
          from pathlib import Path
          sys.path.insert(0, os.environ["REPO"])
          from bananawiki.ops.runtime_agent import TenantRuntime, container_name

          agent = Path(os.environ["AGENT"])
          runtime = TenantRuntime({
              "service": "probe", "service_uid": 4242, "service_gid": 4242, "image": os.environ["IMAGE"],
              "instances_dir": str(agent / "instances"), "tenant_quotas": "off",
              "limits": {"memory_mb": 1024, "cpus": 1.0, "pids": 512, "nofile": 4096},
          }, private_dir=agent / "private")
          limits = {"memory_mb": 768, "cpus": 1.0, "pids": 256, "nofile": 1024, "storage_bytes": 0}

          def healthy(url):
              for _attempt in range(60):
                  try:
                      with urllib.request.urlopen(url, timeout=5) as response:
                          if response.status == 200:
                              return
                  except OSError:
                      pass
                  time.sleep(3)
              raise SystemExit(f"{url} did not answer")

          try:
              print(json.dumps(runtime.call("ping", {})))
              published = runtime.call("tenant.start", {"tenant": "published", "network": "outbound",
                                                        "publish_port": 20001, "limits": limits})
              isolated = runtime.call("tenant.start", {"tenant": "isolated", "network": "isolated", "limits": limits})
              for status in (published, isolated):
                  print(json.dumps(status))
                  assert status["running"] and status["quota_protected"] and status["ipv6_disabled"], status
              healthy("http://127.0.0.1:20001/health")
              healthy(f"http://{isolated['address']}:5001/health")  # what Caddy reaches in subdomain mode
              print(json.dumps(runtime.call("tenant.task", {"tenant": "published",
                                                            "request": {"action": "list_users"}})))
              runtime.call("tenant.stop", {"tenant": "published"})
              # A stopped wiki's task: a one-shot container without network, behind the mount gate.
              print(json.dumps(runtime.call("tenant.task", {"tenant": "published",
                                                            "request": {"action": "list_users"}})))
              runtime.call("tenant.stop", {"tenant": "isolated"})
              left = subprocess.run(["docker", "ps", "--all", "--quiet", "--filter", "label=org.bananawiki.role"],
                                    capture_output=True, text=True, check=True).stdout.split()
              assert not left, left
          except BaseException:
              for name in ("published", "isolated"):
                  subprocess.run(["docker", "logs", container_name(str(agent / "instances" / name))], check=False)
              raise
          EOF
