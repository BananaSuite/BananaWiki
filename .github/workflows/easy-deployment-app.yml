name: Easy Deployment App

on:
  workflow_dispatch:
  # Build on changes to the launcher itself, so it cannot rot unnoticed.
  # It is a three-platform PyInstaller matrix, so it stays off every other change.
  pull_request:
    paths:
      - 'easy_deployment_app/**'
      - 'scripts/build_easy_deployment.py'
      - 'scripts/smoke_test_easy_deployment.py'
      - 'tests/test_easy_deployment_app.py'
      - '.github/workflows/easy-deployment-app.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: BananaWikiEasyDeployment-windows-x86_64
            package_path: easy_deployment_app/dist/BananaWikiEasyDeployment-windows-x86_64.zip
          - os: ubuntu-latest
            artifact: BananaWikiEasyDeployment-linux-x86_64
            package_path: easy_deployment_app/dist/BananaWikiEasyDeployment-linux-x86_64.tar.gz
          - os: macos-14
            artifact: BananaWikiEasyDeployment-macos-arm64
            package_path: easy_deployment_app/dist/BananaWikiEasyDeployment-macos-arm64.zip

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --only-binary=:all: --no-deps --upgrade 'pip>=26.2.1'
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run launcher tests
        run: python -m pytest tests/test_easy_deployment_app.py -q

      - name: Build app
        run: python scripts/build_easy_deployment.py

      - name: Smoke-test packaged app
        run: python scripts/smoke_test_easy_deployment.py "${{ matrix.package_path }}"
        env:
          BANANAWIKI_CONSOLE: "1"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package_path }}
