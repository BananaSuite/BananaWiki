name: Desktop app

on:
  workflow_dispatch:
  # A three-OS PyInstaller matrix: run it when the launcher or its packaging
  # changes, so the builds cannot rot unnoticed, but not on every change.
  pull_request:
    paths:
      - 'bananawiki/desktop/**'
      - 'packaging/desktop/**'
      - 'tests/desktop/**'
      - 'pyproject.toml'
      - '.github/workflows/desktop-app.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            package: packaging/desktop/dist/BananaWiki-Desktop-windows-x86_64.zip
          - os: ubuntu-latest
            name: linux-x86_64
            package: packaging/desktop/dist/BananaWiki-Desktop-linux-x86_64.tar.gz
          - os: macos-14
            name: macos-arm64
            package: packaging/desktop/dist/BananaWiki-Desktop-macos-arm64.zip

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --only-binary=:all: --no-deps --upgrade "pip>=26.2.1"
          python -m pip install . waitress pyinstaller pytest

      - name: Launcher tests
        run: python -m pytest tests/desktop -q -p no:cacheprovider -o addopts=""

      - name: Build
        run: python packaging/desktop/build.py

      - name: Smoke test (serve, /health, /setup, backup)
        run: python packaging/desktop/smoke_test.py "${{ matrix.package }}"

      # Pull requests only prove that the packages build and start; uploading
      # them there would fill the artifact storage quota with throwaway files.
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BananaWiki-Desktop-${{ matrix.name }}
          path: ${{ matrix.package }}
          if-no-files-found: error
          retention-days: 14
