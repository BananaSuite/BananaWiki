name: Desktop app

on:
  workflow_dispatch:
  # A three-OS PyInstaller matrix: run it when the launcher or its packaging
  # changes, so the builds cannot rot unnoticed, but not on every change.
  pull_request:
    paths:
      - 'bananawiki/desktop/**'
      - 'packaging/desktop/**'
      - 'tests/desktop/**'
      - 'pyproject.toml'
      - 'requirements-desktop.lock'
      - 'requirements-build.lock'
      - '.github/workflows/desktop-app.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            package: packaging/desktop/dist/BananaWiki-Desktop-windows-x86_64.zip
          - os: ubuntu-latest
            name: linux-x86_64
            package: packaging/desktop/dist/BananaWiki-Desktop-linux-x86_64.tar.gz
          - os: macos-15
            name: macos-arm64
            package: packaging/desktop/dist/BananaWiki-Desktop-macos-arm64.zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Hash-pinned wheels only, like every other install: the same commit
      # bundles the same dependencies whenever it is built.
      - name: Install
        run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes --upgrade -r requirements-build.lock
          python -m pip install --only-binary=:all: --require-hashes -r requirements-desktop.lock
          python -m pip install --no-deps --no-build-isolation .

      - name: Launcher tests
        run: python -m pytest tests/desktop -q -p no:cacheprovider -o addopts=""

      - name: Build
        run: python packaging/desktop/build.py

      - name: Smoke test (serve, /health, /setup, backup)
        run: python packaging/desktop/smoke_test.py "${{ matrix.package }}"

      # Pull requests only prove that the packages build and start; uploading
      # them there would fill the artifact storage quota with throwaway files.
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BananaWiki-Desktop-${{ matrix.name }}
          path: ${{ matrix.package }}
          if-no-files-found: error
          retention-days: 14
