version: 2
updates:
  # Runtime dependencies are compatible-release ranges; these pull requests
  # make every change inside a range visible and reviewable.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  # Workflow actions are pinned to commit SHAs; keep them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
