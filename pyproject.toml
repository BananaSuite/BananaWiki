[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bananawiki"
dynamic = ["version"]
description = "A self-hosted wiki with page history, fine-grained permissions, chat, kanban boards, canvases and a multi-tenant hosting portal."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Luca Zani and BananaWiki contributors" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Education",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: Wiki",
]
dependencies = [
    "Flask>=3.1,<3.2",
    "Werkzeug>=3.1,<3.2",
    "Jinja2>=3.1,<4",
    "MarkupSafe>=2.1,<4",
    "itsdangerous>=2.2,<3",
    "Markdown>=3.6,<4",
    "Pygments>=2.18,<3",
    "nh3>=0.2.18,<0.4",
    "Pillow>=12.3,<13",
    "cryptography>=50.0.1,<51",
    "filelock>=3.13,<5",
    "fpdf2>=2.8,<3",
    "qrcode>=7.4,<9",
    "gunicorn>=26.2,<27; sys_platform != 'win32'",
    "waitress>=3,<4",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
tts = ["piper-tts==1.8.0"]
hosting = [
    "dnspython>=2.8,<3",
    "urllib3>=2.8,<3",
    "google-api-python-client>=2.100,<3",
    "google-auth>=2.23,<3",
]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.5",
    "ruff>=0.6",
]

[project.scripts]
bananawiki = "bananawiki.cli:main"

[project.urls]
Homepage = "https://github.com/BananaSuite/BananaWiki"
Source = "https://github.com/BananaSuite/BananaWiki"
Issues = "https://github.com/BananaSuite/BananaWiki/issues"

[tool.setuptools.dynamic]
version = { attr = "bananawiki.__version__" }

[tool.setuptools.packages.find]
include = ["bananawiki*", "bananawiki_sdk*"]

[tool.setuptools.package-data]
"bananawiki.ops" = ["seccomp/*"]
"bananawiki.wiki.features.auth" = ["builtin_docs/**/*.md"]
"bananawiki.wiki.features.plugin_manager" = ["PLUGINS.md", "examples/**/*"]
"*" = [
    "templates/**/*",
    "static/**/*",
    "translations/*.json",
    "migrations/*.sql",
    "content/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
tmp_path_retention_policy = "failed"
filterwarnings = ["error::DeprecationWarning:bananawiki.*"]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["docs/plugins/examples"]

[tool.ruff.lint]
select = ["F", "E9", "B", "S", "UP", "SIM", "I"]
ignore = [
    "S101",  # assert is fine in tests
    "S603",  # subprocess without shell is the safe form; each call site is reviewed
    "S607",  # partial executable paths (git, docker, systemctl) are resolved via PATH on purpose
    "SIM105",
    "SIM108",
    # SQL is assembled only from literal fragments and validated identifiers
    # (core.sqlite.quote_identifier); values always go through ? parameters.
    # Reviewed in the security review rather than flagged per line.
    "S608",
    # Markup() is applied to HTML the application built and escaped itself.
    "S704",
    # Constant names such as SESSION_TOKEN_KEY are form/session keys, not secrets.
    "S105",
    # "0.0.0.0" appears only in comparisons and port probes, never as a bind default.
    "S104",
    "SIM102",
    "SIM103",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
