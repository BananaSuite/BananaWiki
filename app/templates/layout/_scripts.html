    <script nonce="{{ csp_nonce }}">
    /* Apply sidebar category collapse state immediately to prevent flash of expanded categories.
       This runs synchronously before main.js loads so the browser never paints the
       "all-expanded" state. main.js will re-apply the same state, which is a no-op. */
    (function() {
        try {
            var expanded = JSON.parse(localStorage.getItem('bw_expanded_cats') || '[]');
            document.querySelectorAll('.nav-section[data-cat-id]').forEach(function(s) {
                if (!s.querySelector('.nav-item.active') && expanded.indexOf(s.dataset.catId) === -1) {
                    s.classList.add('collapsed');
                }
            });
        } catch (e) {}
    }());

    {% if guided_tour_state and guided_tour_state.active %}
    <script nonce="{{ csp_nonce }}">
    (function() {
        var state = window.BW_LIVE_TOUR;
        var root = document.querySelector('[data-live-tour]');
        if (!state || !root) return;

        function isVisibleCandidate(el) {
            if (!el) return false;
            var rect = el.getBoundingClientRect();
            var style = window.getComputedStyle(el);
            return rect.width > 0 && rect.height > 0 && style.display !== 'none' && style.visibility !== 'hidden';
        }

        function findTourTarget(selector) {
            var parts = String(selector || '').split(',');
            for (var i = 0; i < parts.length; i += 1) {
                var part = parts[i].trim();
                if (!part) continue;
                try {
                    var matches = document.querySelectorAll(part);
                    for (var j = 0; j < matches.length; j += 1) {
                        if (isVisibleCandidate(matches[j])) return matches[j];
                    }
                } catch (e) {}
            }
            return document.getElementById('main-content') || document.body;
        }

        function prepareTourSurface(selector) {
            if (String(selector || '').indexOf('sidebar-') === -1) return;
            var sidebar = document.getElementById('sidebar');
            if (!sidebar) return;
            var toggleBtn = document.getElementById('sidebar-toggle');
            var overlay = document.getElementById('sidebar-overlay');
            if (window.innerWidth <= 768) {
                sidebar.classList.add('open');
                if (overlay) overlay.classList.add('active');
                if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'true');
            } else if (document.body.classList.contains('sidebar-collapsed')) {
                document.body.classList.remove('sidebar-collapsed');
                if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'true');
            }
        }

        prepareTourSurface(state.selector);
        var target = findTourTarget(state.selector);
        var targetSidebar = target.closest ? target.closest('#sidebar') : null;
        if (targetSidebar) {
            targetSidebar.classList.add('live-tour-surface-active');
        }

        var spotlight = root.querySelector('[data-live-tour-spotlight]');
        var popover = root.querySelector('[data-live-tour-popover]');
        var scrims = {
            top: root.querySelector('[data-live-tour-scrim="top"]'),
            right: root.querySelector('[data-live-tour-scrim="right"]'),
            bottom: root.querySelector('[data-live-tour-scrim="bottom"]'),
            left: root.querySelector('[data-live-tour-scrim="left"]')
        };

        function submitTour(url) {
            if (!url) return;
            var form = document.createElement('form');
            var token = document.createElement('input');
            form.method = 'POST';
            form.action = url;
            token.type = 'hidden';
            token.name = 'csrf_token';
            token.value = getCsrfToken();
            form.appendChild(token);
            document.body.appendChild(form);
            form.submit();
        }

        function placeOverlay() {
            target.scrollIntoView({ block: 'center', inline: 'nearest', behavior: 'auto' });
            var rect = target.getBoundingClientRect();
            if (!rect.width || !rect.height) {
                rect = (document.getElementById('main-content') || document.body).getBoundingClientRect();
            }
            var pad = 8;
            var top = Math.max(8, rect.top - pad);
            var left = Math.max(8, rect.left - pad);
            var right = Math.min(window.innerWidth - 8, rect.right + pad);
            var bottom = Math.min(window.innerHeight - 8, rect.bottom + pad);
            var width = Math.max(24, right - left);
            var height = Math.max(24, bottom - top);

            scrims.top.style.cssText = 'top:0;left:0;width:100vw;height:' + top + 'px';
            scrims.bottom.style.cssText = 'top:' + bottom + 'px;left:0;width:100vw;height:' + Math.max(0, window.innerHeight - bottom) + 'px';
            scrims.left.style.cssText = 'top:' + top + 'px;left:0;width:' + left + 'px;height:' + height + 'px';
            scrims.right.style.cssText = 'top:' + top + 'px;left:' + right + 'px;width:' + Math.max(0, window.innerWidth - right) + 'px;height:' + height + 'px';
            spotlight.style.cssText = 'top:' + top + 'px;left:' + left + 'px;width:' + width + 'px;height:' + height + 'px';

            var margin = 12;
            var gap = 14;
            var popoverWidth = Math.min(380, window.innerWidth - (margin * 2));
            popover.style.width = popoverWidth + 'px';
            popover.style.maxHeight = Math.max(160, window.innerHeight - (margin * 2)) + 'px';
            popover.style.overflowY = 'auto';
            var popoverHeight = Math.min(popover.scrollHeight || popover.offsetHeight || 220, window.innerHeight - (margin * 2));
            var targetBox = { left: left, top: top, right: right, bottom: bottom };

            function clamp(value, min, max) {
                return Math.min(Math.max(value, min), max);
            }

            function overlapArea(candidate) {
                var ox = Math.max(0, Math.min(candidate.right, targetBox.right) - Math.max(candidate.left, targetBox.left));
                var oy = Math.max(0, Math.min(candidate.bottom, targetBox.bottom) - Math.max(candidate.top, targetBox.top));
                return ox * oy;
            }

            function candidate(x, y, preference) {
                var maxLeft = Math.max(margin, window.innerWidth - popoverWidth - margin);
                var maxTop = Math.max(margin, window.innerHeight - popoverHeight - margin);
                var cx = clamp(x, margin, maxLeft);
                var cy = clamp(y, margin, maxTop);
                var box = {
                    left: cx,
                    top: cy,
                    right: cx + popoverWidth,
                    bottom: cy + popoverHeight,
                    preference: preference
                };
                box.overlap = overlapArea(box);
                box.distance = Math.abs((box.left + box.right) / 2 - (targetBox.left + targetBox.right) / 2)
                    + Math.abs((box.top + box.bottom) / 2 - (targetBox.top + targetBox.bottom) / 2);
                return box;
            }

            var centerX = left + (width / 2);
            var centerY = top + (height / 2);
            var candidates = [
                candidate(centerX - (popoverWidth / 2), bottom + gap, 0),
                candidate(centerX - (popoverWidth / 2), top - popoverHeight - gap, 1),
                candidate(right + gap, centerY - (popoverHeight / 2), 2),
                candidate(left - popoverWidth - gap, centerY - (popoverHeight / 2), 3),
                candidate(margin, window.innerHeight - popoverHeight - margin, 4),
                candidate(window.innerWidth - popoverWidth - margin, window.innerHeight - popoverHeight - margin, 5),
                candidate(margin, margin, 6),
                candidate(window.innerWidth - popoverWidth - margin, margin, 7)
            ];
            candidates.sort(function(a, b) {
                if (a.overlap !== b.overlap) return a.overlap - b.overlap;
                if (a.preference !== b.preference) return a.preference - b.preference;
                return b.distance - a.distance;
            });

            popover.style.left = candidates[0].left + 'px';
            popover.style.top = candidates[0].top + 'px';
        }

        target.classList.add('live-tour-target-active');
        target.setAttribute('data-live-tour-target-active', '1');
        window.setTimeout(placeOverlay, 40);
        window.addEventListener('resize', placeOverlay);
        window.addEventListener('scroll', placeOverlay, true);

        target.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            submitTour(state.next_url);
        }, true);

        var next = root.querySelector('[data-live-tour-next]');
        var prev = root.querySelector('[data-live-tour-prev]');
        var finish = root.querySelector('[data-live-tour-finish]');
        if (next) next.addEventListener('click', function() { submitTour(state.next_url); });
        if (prev) prev.addEventListener('click', function() { submitTour(state.prev_url); });
        if (finish) finish.addEventListener('click', function() { submitTour(state.finish_url); });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') submitTour(state.finish_url);
            if (e.key === 'ArrowRight') submitTour(state.next_url);
            if (e.key === 'ArrowLeft' && state.prev_url) submitTour(state.prev_url);
        });
    })();
    </script>
    {% endif %}
    <script nonce="{{ csp_nonce }}">
    // Auto-inject CSRF token into all forms that don't already have one
    document.querySelectorAll('form[method="POST"], form[method="post"]').forEach(function(form) {
        if (!form.querySelector('input[name="csrf_token"]')) {
            var input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'csrf_token';
            input.value = getCsrfToken();
            form.appendChild(input);
        }
    });
    </script>
    {% if user_accessibility %}
    <script nonce="{{ csp_nonce }}">
    // Initialize accessibility with server-side settings
    document.addEventListener('DOMContentLoaded', function() {
        initAccessibility({{ user_accessibility | tojson }});
    });
    // Re-apply accessibility prefs when the page is restored from bfcache
    // (e.g. Firefox Ctrl+Shift+T).  DOMContentLoaded does NOT fire in that
    // case so inline styles set by applyA11yPrefs() may be lost.
    window.addEventListener('pageshow', function(e) {
        if (e.persisted) applyA11yPrefs(_a11yPrefs);
    });
    </script>
