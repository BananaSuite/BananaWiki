{% extends "base.html" %}
{% block title %}{{ t('groups.new.title') }} | {{ settings.site_name }}{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{{ t('groups.new.heading') }}</h1>
</div>

<form class="u-mw400" method="POST" action="{{ url_for('group_new') }}" id="createGroupForm">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
        <label>{{ t('groups.new.name') }}</label>
        <input type="text" name="name" class="input" required placeholder="{{ t('groups.new.name_placeholder') }}" maxlength="100" autocomplete="off">
    </div>
    <div class="form-group">
        <label>{{ t('groups.new.description') }}</label>
        <textarea name="description" class="input" rows="3" maxlength="500" placeholder="{{ t('groups.new.description_placeholder') }}"></textarea>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn">{{ t('groups.new.submit') }}</button>
        <a href="{{ url_for('group_list') }}" class="btn btn-outline">{{ t('common.cancel') }}</a>
    </div>
</form>
{% endblock %}
