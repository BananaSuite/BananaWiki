{% extends "base.html" %}
{% block title %}{{ t('groups.join.title') }} | {{ settings.site_name }}{% endblock %}
{% block content %}
<h1>{{ t('groups.join.heading') }}</h1>

<form class="u-mw400" method="POST" action="{{ url_for('group_join') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
        <label>{{ t('groups.join.invite_code') }}</label>
        <input type="text" name="invite_code" class="input" required placeholder="{{ t('groups.join.invite_code_placeholder') }}" autocomplete="off">
    </div>
    <div class="form-actions">
        <button type="submit" class="btn">{{ t('groups.join.submit') }}</button>
        <a href="{{ url_for('group_list') }}" class="btn btn-outline">{{ t('common.cancel') }}</a>
    </div>
</form>
{% endblock %}
