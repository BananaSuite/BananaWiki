{% extends "base.html" %}
{% block title %}{{ t('account.force_change_password.title') }} | {{ settings.site_name }}{% endblock %}
{% block content %}
<div class="settings-section" style="max-width: 480px; margin: 4rem auto;">
    <h2>{{ t('account.force_change_password.heading') }}</h2>
    <p>{{ t('account.force_change_password.help') }}</p>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="action" value="change_password">

        <div class="form-group">
            <label>{{ t('account.force_change_password.new_username') }}</label>
            <input type="text" name="new_username" class="input" value="{{ user.username }}" minlength="3" maxlength="50">
        </div>

        <div class="form-group">
            <label>{{ t('account.force_change_password.new_password') }}</label>
            <input type="password" name="new_password" class="input" required minlength="8" maxlength="1024" autocomplete="new-password">
        </div>

        <div class="form-group">
            <label>{{ t('account.force_change_password.confirm_password') }}</label>
            <input type="password" name="confirm_password" class="input" required minlength="8" maxlength="1024" autocomplete="new-password">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{{ t('account.force_change_password.submit') }}</button>
        </div>
    </form>
</div>
{% endblock %}
