{% if active_hosting_banners %}
<div id="hosting-banners-bar" class="hosting-banners-bar" aria-live="polite"
     data-viewer-id="{{ current_account.id if current_account else 'guest' }}">
    {% for banner in active_hosting_banners %}
    <div class="hosting-banner hosting-banner-{{ banner.color }}"
         data-banner-id="{{ banner.id }}"
         data-banner-revision="{{ banner.revision }}"
         data-not-removable="{{ banner.not_removable }}"
         data-show-countdown="{{ banner.show_countdown }}"
         data-expires-at="{{ banner.expires_at or '' }}"
         data-banner-background="{{ banner.custom_background or '' }}"
         data-banner-text="{{ banner.custom_text_color or '' }}">
        <div class="hosting-banner-inner">
            <div class="hosting-banner-content">{{ banner.content }}</div>
            <div class="hosting-banner-controls">
                <span class="hosting-banner-countdown" hidden></span>
                <button type="button" class="hosting-banner-nav hosting-banner-prev" hidden aria-label="{{ t('hosting.banners.previous') }}">&#8249;</button>
                <span class="hosting-banner-position" hidden></span>
                <button type="button" class="hosting-banner-nav hosting-banner-next" hidden aria-label="{{ t('hosting.banners.next') }}">&#8250;</button>
                {% if not banner.not_removable %}
                <button type="button" class="hosting-banner-close" aria-label="{{ t('hosting.banners.dismiss') }}">&#10005;</button>
                {% endif %}
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endif %}
